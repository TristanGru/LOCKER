  source: 'expedite_effect: one delay regime faster'
redundancy_loss_score:
  value: 0.6
  tag: assumed
  source: a component that loses a redundant unit (still above minimum working) is degraded; same score as equipment status
    3
system_capable_score:
  value: 0.6
  tag: assumed
  source: a critical system at or above this score counts toward mission-area capability (the yellow band edge)
