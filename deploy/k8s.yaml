# One Deployment (1 replica: one shared scenario per server, R8) + one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missiontwin
  namespace: missiontwin
  labels: {app: missiontwin}
spec:
  replicas: 1
  selector:
    matchLabels: {app: missiontwin}
  template:
    metadata:
      labels: {app: missiontwin}
    spec:
      containers:
        - name: missiontwin
          image: missiontwin:0.1.0
          ports: [{containerPort: 8000}]
          env:
            - {name: MISSIONTWIN_DEMO_MODE, value: "1"}   # cache-only LLM; set 0 and LLM_BASE_URL for a live model
            - {name: LLM_BASE_URL, value: ""}             # OpenAI-compatible, e.g. an on-ship model served in-cluster
            - {name: LLM_MODEL, value: ""}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: missiontwin
  namespace: missiontwin
spec:
  selector: {app: missiontwin}
  ports: [{port: 8000, targetPort: 8000}]
