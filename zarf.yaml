kind: ZarfPackageConfig
metadata:
  name: locker
  version: "###ZARF_PKG_TMPL_VERSION###"
  description: LOCKER offline demo

components:
  - name: locker
    required: true

    actions:
      # Runs during `zarf package create` -- build + export happen automatically
      onCreate:
        before:
          - cmd: docker build --platform linux/amd64 -t zarf.internal/locker:###ZARF_PKG_TMPL_VERSION### .
          - cmd: docker save -o locker-image.tar zarf.internal/locker:###ZARF_PKG_TMPL_VERSION###
      # Runs during `zarf package deploy` -- fail the deploy if the pod never comes up
      onDeploy:
        after:
          - wait:
              cluster:
                kind: deployment
                name: locker
                namespace: locker
                condition: Available

    imageArchives:
      - path: locker-image.tar
        images:
          - zarf.internal/locker:###ZARF_PKG_TMPL_VERSION###

    manifests:
      - name: locker
        namespace: locker
        files:
          - k8s/app.yaml