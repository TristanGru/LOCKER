name: Offline demo
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISSIONTWIN_DEMO_MODE: '1'
      PLAYWRIGHT_CHANNEL: chromium
      LOCKER_TEST_OUTPUT: ${{ github.workspace }}/.artifacts/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-demo.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python -m pytest -q
      - name: Bundle pinned local MiniLM and WASM assets
        run: python scripts/bundle_overview_embeddings.py
      - run: python scripts/check_demo.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: .artifacts/browser
